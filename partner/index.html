<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老西门街道社群孵化项目 · 伙伴看板</title>
<style>

  :root{
    --primary:#2b6cb0; --primary2:#4299e1; --accent:#ed64a6; --accent2:#fbb6ce;
    --done:#38a169; --doing:#dd6b20; --todo:#a0aec0;
    --bg:#f7fafc; --card:#fff; --ink:#2d3748; --sub:#718096; --line:#e2e8f0;
    --soft:#fff0f5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei","微软雅黑",-apple-system,"PingFang SC",sans-serif;
    font-size:14px;line-height:1.55;}
  .top{max-width:1240px;margin:0 auto;padding:18px 22px 6px;}
  h1{font-size:20px;color:var(--primary);margin:0 0 2px;font-weight:800;}
  .sub{color:var(--sub);font-size:12.5px;margin-bottom:14px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
       box-shadow:0 1px 3px rgba(0,0,0,.04);border-top:3px solid var(--accent);}
  .kpi .v{font-size:22px;font-weight:800;color:var(--primary);}
  .kpi .l{font-size:12px;color:var(--sub);margin-top:2px;}
  .kpi .v small{font-size:12px;color:var(--sub);font-weight:600;}
  .tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px;}
  .tab{padding:9px 18px;cursor:pointer;border:1px solid transparent;border-bottom:none;
       border-radius:8px 8px 0 0;color:var(--sub);font-weight:600;font-size:14px;}
  .tab.on{background:var(--card);color:var(--primary);border-color:var(--line);
          position:relative;top:2px;border-bottom:2px solid var(--accent);}
  .view{display:none;max-width:1240px;margin:0 auto;padding:0 22px 40px;}
  .view.on{display:block;}
  /* 筛选 chips */
  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;}
  .filters .flabel{font-size:12px;color:var(--sub);margin-right:4px;font-weight:600;}
  .chip{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;
        cursor:pointer;font-size:12.5px;color:var(--sub);user-select:none;}
  .chip:hover{border-color:var(--primary2);}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .legend{font-size:11.5px;color:var(--sub);margin:0 0 10px;display:flex;gap:14px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  /* 问卷横幅 */
  .qn-banner{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#eaf2fb,#fdeef6);
    border:1px solid #dbe7f3;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;color:var(--ink);}
  .qn-banner .qn-t{font-weight:800;color:var(--primary);}
  .qn-banner a{margin-left:auto;background:var(--primary);color:#fff;text-decoration:none;padding:7px 16px;border-radius:8px;font-weight:700;white-space:nowrap;}
  .qn-banner a:hover{background:var(--primary2);}
  /* 活动细项按状态着色 */
  .card.s-done{border-left-color:var(--done);background:#f3fcf6;}
  .card.s-doing{border-left-color:var(--doing);background:#fffaf0;}
  .card.s-todo{border-left-color:var(--todo);background:#f7fafc;}
  /* 折叠 */
  .cat-head{cursor:pointer;}
  .cat-head::before{content:"▾ ";font-size:12px;}
  .cat-section.collapsed > .cat-head::before{content:"▸ ";}
  .cat-section.collapsed > .cat-body{display:none;}
  .slabel{cursor:pointer;user-select:none;}
  .slabel::before{content:"▾ ";font-size:10px;color:var(--sub);margin-right:2px;}
  .status-band.collapsed > .slabel::before{content:"▸ ";}
  .status-band.collapsed > .cards{display:none;}
  /* 活动看板：纵向大类 + 横向卡片 */
  .board{display:flex;flex-direction:column;gap:16px;padding-bottom:8px;}
  .cat-section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .cat-head{font-weight:700;padding:7px 12px;border-radius:7px;color:#fff;font-size:14px;
            background:linear-gradient(90deg,var(--primary),var(--primary2));display:inline-block;margin-bottom:12px;}
  .status-band{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-bottom:8px;}
  .status-band:last-child{margin-bottom:0;}
  .status-band .slabel{font-size:12px;font-weight:700;color:var(--sub);width:58px;flex-shrink:0;display:flex;align-items:center;}
  .status-band .cards{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0;}
  .card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--primary2);
        border-radius:7px;padding:7px 9px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;
        flex:1 1 160px;min-width:160px;max-width:200px;display:flex;flex-direction:column;}
  .card:hover{box-shadow:0 3px 8px rgba(0,0,0,.1);}
  .card .nm{font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:5px;line-height:1.35;}
  .card .meta{font-size:11px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:5px;}
  .card .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle;}
  .badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;color:#fff;width:fit-content;}
  .b-done{background:var(--done);} .b-doing{background:var(--doing);} .b-todo{background:var(--todo);}
  .search input{width:100%;max-width:340px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;}
  /* 日历 */
  .cal-nav{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .cal-nav button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--primary);}
  .cal-nav .mlabel{font-weight:700;font-size:15px;color:var(--primary);min-width:120px;text-align:center;}
  .month{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .wd{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff;}
  .wd div{padding:7px 0;text-align:center;font-size:12.5px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .day{border:1px solid #eef1f6;min-height:92px;padding:4px 5px;vertical-align:top;font-size:11px;}
  .day.other{background:#fafbfc;color:#c2c9d6;}
  .day .dn{font-weight:700;color:#9aa4b5;font-size:11px;}
  .day.today .dn{color:var(--accent);}
  .ev{background:var(--primary2);color:#fff;border-radius:4px;padding:1px 5px;margin-top:3px;font-size:10.5px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .ev.done{background:var(--done);} .ev.doing{background:var(--doing);} .ev.todo{background:var(--todo);}
  .ev.many{background:#9aa4b5;}
  /* 费用看板 */
  .cost-top{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .cost-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .cost-card h3{margin:0 0 8px;font-size:14px;color:var(--primary);}
  .bar{height:14px;background:#eef1f6;border-radius:8px;overflow:hidden;margin:8px 0 4px;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary2),var(--done));}
  .bar-sm > i{background:linear-gradient(90deg,var(--accent),var(--doing));}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px;}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;}
  th{background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff;font-weight:600;}
  tr:nth-child(even) td{background:#fafbfc;}
  .modal{position:fixed;inset:0;background:rgba(20,30,50,.5);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal.on{display:flex;}
  .modal .box{background:#fff;max-width:460px;width:90%;border-radius:12px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .modal .box h3{margin:0 0 12px;color:var(--primary);font-size:16px;}
  .modal .kv{display:flex;gap:8px;margin:6px 0;font-size:13px;}
  .modal .kv b{color:var(--sub);min-width:78px;font-weight:600;}
  .modal .close{margin-top:14px;text-align:right;}
  .modal .close button{border:none;background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff;border-radius:7px;padding:7px 16px;cursor:pointer;font-size:13px;}

</style>
</head>
<body>
<div class="top">
  <h1>“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目</h1>
  <div class="sub">活动看板 · 日历视图 ｜ 数据来源：进度费用融合跟进表 V5（过会版 2026-08-26）｜ 周期 2026年7月–11月</div>
  <div class="qn-banner">
    <span class="qn-t">📝 活动反馈问卷</span>
    <span>诚邀各位伙伴填写，帮我们持续优化社群活动～</span>
    <a href="https://wj.qq.com/s2/27647616/pg6d/" target="_blank" rel="noopener">填写问卷 ↗</a>
  </div>
  <div class="kpis" id="kpis"></div>
</div>

<div class="top" style="padding-top:0;">
  <div class="tabs">
    <div class="tab on" data-v="board">活动看板</div>
    <div class="tab" data-v="cal">日历视图</div>
    
  </div>
</div>

<!-- 活动看板 -->
<div class="view on" id="view-board">
  <div class="filters" id="board-ops">
    <span class="flabel">看板操作：</span>
    <span class="chip" onclick="collapseAll(true)">全部折叠</span>
    <span class="chip" onclick="collapseAll(false)">全部展开</span>
  </div>
  <div class="search"><input id="q" placeholder="搜索活动名称 / 社群 / 牵头人…"></div>
  <div class="filters" id="board-filters">
    <span class="flabel">板块筛选：</span>
  </div>
  <div class="filters" id="board-status-filters">
    <span class="flabel">状态筛选：</span>
  </div>
  <div class="filters" id="board-month-filters">
    <span class="flabel">月份筛选：</span>
  </div>
  <div class="legend" id="legend"></div>
  <div class="board" id="board"></div>
</div>

<!-- 日历 -->
<div class="view" id="view-cal">
  <div class="filters" id="cal-filters">
    <span class="flabel">板块筛选：</span>
  </div>
  <div class="filters" id="cal-status-filters">
    <span class="flabel">状态筛选：</span>
  </div>
  <div class="cal-nav">
    <button id="prev">‹ 上月</button>
    <div class="mlabel" id="mlabel"></div>
    <button id="next">下月 ›</button>
    <span class="flabel" style="margin-left:14px;">展示方式：</span>
    <button class="chip on" data-mode="start">仅开始日</button>
    <button class="chip" data-mode="span">区间跨度</button>
    <button class="chip" data-mode="end">仅结束日</button>
  </div>
  <div style="font-size:11.5px;color:var(--sub);margin:4px 0 10px;">
    说明：日历挂靠的是 V5 表中的「计划开始 / 计划结束」字段。「仅开始日」= 活动在计划开始那天标出；「区间跨度」= 从开始到结束每天填充；「仅结束日」= 仅在计划结束那天标出。
  </div>
  <div class="month">
    <div class="wd"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="grid" id="cal-grid"></div>
  </div>
</div>



<div class="modal" id="modal">
  <div class="box">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div class="close"><button onclick="closeModal()">关闭</button></div>
  </div>
</div>

  <div class="kpi"><div class="v">${sm.status_dist["\u672a\u542f\u52a8"]||0}<small> 项</small></div><div class="l">未启动</div></div>
  <div class="kpi"><div class="v">${sm.date_min||''} ~ ${sm.date_max||''}</div><div class="l">活动排期范围</div></div>
`;

const acts = DATA.activities;
const bySeq = {}; acts.forEach(a=>bySeq[a.seq]=a);

// 板块（大类）与社群选项
const catOrder = ['一、社群矩阵搭建','二、社群种子招募','三、社群孵化活动','四、社群项目支持与反哺','机制建设','品牌输出'];
function bucketLabel(b){
  const w = Object.keys(DATA.summary.status_dist).find(x=>statusClass(x)===b);
  return w || ({done:'已完成',doing:'进行中',todo:'未启动'}[b]);
}
function renderLegend(){
  const order=[['done','var(--done)'],['doing','var(--doing)'],['todo','var(--todo)']];
  const el=document.getElementById('legend');
  if(!el) return;
  el.innerHTML = order.map(([b,c])=>`<span><i style="background:${c}"></i>${bucketLabel(b)}</span>`).join('')
    + '<span style="margin-left:8px;color:var(--primary);">（每个板块纵向排列，活动卡片横向排列）</span>';
}
const statusOptions = [
  {k:'done', l:bucketLabel('done')},
  {k:'doing', l:bucketLabel('doing')},
  {k:'todo', l:bucketLabel('todo')}
];

function cardHtml(a){
  const sc = statusClass(a.status);
  const badge = (SHOW_COST && a.budget) ? `<span class="badge b-${sc}">预算 ${fmt(a.budget)}元</span>` : '';
  return `<div class="card s-${sc}" onclick="openDetail(${a.seq})">
    <div class="nm">${a.sub}</div>
    <div class="meta">
      <span><span class="dot" style="background:${C[sc]}"></span>${a.status||'—'}</span>
      ${a.start?`<span>📅 ${a.start}${a.end&&a.end!==a.start?'~'+a.end:''}</span>`:''}
      ${a.community?`<span>👥 ${a.community}</span>`:''}
      ${a.lead?`<span>👤 ${a.lead}</span>`:''}
      ${a.location?`<span>📍 ${a.location}</span>`:''}
    </div>
    ${badge}
  </div>`;
}

// 活动看板：纵向大类，每个大类内按状态分组（可折叠），卡片横向排列
function renderBoard(){
  const box=document.getElementById('board');
  const present = Array.from(new Set(acts.map(a=>a.category||'其他')));
  const cats = [...catOrder.filter(c=>present.includes(c)), ...present.filter(c=>!catOrder.includes(c))]
    .filter(c => (!F.cat.size || F.cat.has(c)));
  const labels={done:'已完成',doing:'进行中',todo:'未启动'};
  let html='';
  cats.forEach(c=>{
    const items = acts.filter(a=>a.category===c && passFilter(a));
    if(!items.length) return;
    let bands='';
    ['done','doing','todo'].forEach(s=>{
      const g = items.filter(a=>statusClass(a.status)===s);
      if(g.length){
        bands += `<div class="status-band"><div class="slabel" onclick="this.parentElement.classList.toggle('collapsed')">${labels[s]}（${g.length}）</div><div class="cards">${g.map(cardHtml).join('')}</div></div>`;
      }
    });
    html += `<div class="cat-section"><div class="cat-head" onclick="this.parentElement.classList.toggle('collapsed')">${c}（${items.length}）</div><div class="cat-body">${bands}</div></div>`;
  });
  if(!cats.length || !html) html='<div style="color:#b3bac6;padding:12px;">（未选择任何板块或无匹配活动）</div>';
  box.innerHTML = html;
}
// 全部折叠 / 展开（仅作用于状态分组，便于快速缩短表格）
function collapseAll(v){
  document.querySelectorAll('#view-board .status-band').forEach(e=>e.classList.toggle('collapsed', v));
}

// 通用 chips 渲染
function renderChips(containerId, items, set){
  const box=document.getElementById(containerId);
  box.querySelectorAll('.chip').forEach(x=>x.remove());
  items.forEach(it=>{
    const c=document.createElement('span');
    c.className='chip'+(set.has(it)?' on':'');
    c.textContent=it;
    c.onclick=()=>{
      if(set.has(it)) set.delete(it); else set.add(it);
      renderChips('board-filters',catOrder,F.cat);
      renderStatusChips();
      renderChips('cal-filters',catOrder,F.cat);
      renderBoard(); renderCal();
    };
    box.appendChild(c);
  });
  const r=document.createElement('span');
  r.className='chip'; r.textContent='清空板块';
  r.onclick=()=>{ set.clear(); renderChips('board-filters',catOrder,F.cat); renderChips('cal-filters',catOrder,F.cat); renderBoard(); renderCal(); };
  box.appendChild(r);
}
// 状态 chips
function renderStatusChips(){
  ['board-status-filters','cal-status-filters'].forEach(id=>{
    const box=document.getElementById(id);
    if(!box) return;
    box.querySelectorAll('.chip').forEach(x=>x.remove());
    statusOptions.forEach(o=>{
      const c=document.createElement('span');
      c.className='chip'+(F.status.has(o.k)?' on':'');
      c.textContent=o.l;
      c.onclick=()=>{
        if(F.status.has(o.k)) F.status.delete(o.k); else F.status.add(o.k);
        renderStatusChips();
        renderBoard(); renderCal();
      };
      box.appendChild(c);
    });
    const r=document.createElement('span');
    r.className='chip'; r.textContent='全部状态';
    r.onclick=()=>{ F.status.clear(); renderStatusChips(); renderBoard(); renderCal(); };
    box.appendChild(r);
  });
}
// 月份筛选 chips
function renderMonthChips(){
  const box=document.getElementById('board-month-filters');
  box.querySelectorAll('.chip').forEach(x=>x.remove());
  MONTHS.forEach(ym=>{
    const c=document.createElement('span');
    c.className='chip'+(F.month.has(ym)?' on':'');
    c.textContent=ym.replace('-','年')+'月';
    c.onclick=()=>{ if(F.month.has(ym)) F.month.delete(ym); else F.month.add(ym); renderMonthChips(); renderBoard(); renderCal(); };
    box.appendChild(c);
  });
  const r=document.createElement('span');
  r.className='chip'; r.textContent='全部月份';
  r.onclick=()=>{ F.month.clear(); renderMonthChips(); renderBoard(); renderCal(); };
  box.appendChild(r);
}

// 详情弹窗
function openDetail(seq){
  const a=bySeq[seq]; if(!a) return;
  document.getElementById('m-title').textContent = a.sub;
  const rows = [
    ['大类', a.category],['预算细项', a.detail],['当前状态', a.status],
    ['计划开始', a.start],['计划结束', a.end],['活动地点', a.location||'—'],
    ['关联社群', a.community||'—'],
    ['牵头人', a.lead||'—'],['协同', a.support||'—'],['活动目标KPI', a.kpi||'—']
  ];
  if(SHOW_COST){
    rows.push(['预算金额', a.budget?fmt(a.budget)+' 元':'—']);
    rows.push(['已登记支出', a.spent?fmt(a.spent)+' 元':'—']);
    rows.push(['支付状态', a.pay_status||'—']);
  }
  rows.push(['下一步待办', a.next||'—']);
  document.getElementById('m-body').innerHTML = rows.map(r=>`<div class="kv"><b>${r[0]}</b><span>${r[1]||'—'}</span></div>`).join('');
  document.getElementById('modal').classList.add('on');
}
function openDayList(ds, total){
  const list = acts.filter(a=>{
    if(!passFilter(a)) return false;
    if(calMode==='start') return a.start===ds;
    if(calMode==='end')   return a.end && a.end===ds;
    return a.start && a.start<=ds && (!a.end || a.end>=ds);
  });
  document.getElementById('m-title').textContent = `${ds} 共 ${total} 项活动`;
  document.getElementById('m-body').innerHTML = list.map(a=>`
    <div style="margin:7px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;border-left:3px solid ${C[statusClass(a.status)]};cursor:pointer;" onclick="openDetail(${a.seq})">
      <div style="font-weight:700;font-size:13px;">${a.sub}</div>
      <div style="font-size:11px;color:var(--sub);margin-top:3px;">
        <span><span class="dot" style="background:${C[statusClass(a.status)]}"></span>${a.status}</span>
        ${a.community?`· ${a.community}`:''}
        ${a.lead?`· ${a.lead}`:''}
      </div>
    </div>
  `).join('');
  document.getElementById('modal').classList.add('on');
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }

// 日历
const MONTHS = ['2026-07','2026-08','2026-09','2026-10','2026-11'];
let mi = 1; // 默认 2026-08
let calMode = 'start'; // start | span | end
const TODAY = new Date().toISOString().slice(0,10);
function renderCal(){
  const ym = MONTHS[mi];
  const [y,m] = ym.split('-').map(Number);
  document.getElementById('mlabel').textContent = `${y}年${m}月`;
  const first = new Date(y, m-1, 1);
  let startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  let html='';
  cells.forEach(d=>{
    if(d===null){ html+='<div class="day other"></div>'; return; }
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = acts.filter(a=>{
      if(!passFilter(a)) return false;
      if(calMode==='start') return a.start===ds;
      if(calMode==='end')   return a.end && a.end===ds;
      return a.start && a.start<=ds && (!a.end || a.end>=ds); // span
    });
    const evHtml = evs.slice(0,4).map(a=>`<div class="ev ${statusClass(a.status)}" title="${a.sub}｜${a.status}｜${a.community||''}" onclick="openDetail(${a.seq})">${a.sub.length>12?a.sub.slice(0,12)+'…':a.sub}</div>`).join('')
      + (evs.length>4?`<div class="ev many" onclick="openDayList('${ds}',${evs.length})">+${evs.length-4}项</div>`:'');
    html += `<div class="day${ds===TODAY?' today':''}"><div class="dn">${d}</div>${evHtml}</div>`;
  });
  document.getElementById('cal-grid').innerHTML = html;
}

// 日历展示方式切换
document.querySelectorAll('.cal-nav .chip[data-mode]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.cal-nav .chip[data-mode]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); calMode=b.dataset.mode; renderCal();
  };
});
document.getElementById('prev').onclick=()=>{ mi=(mi-1+MONTHS.length)%MONTHS.length; renderCal(); };
document.getElementById('next').onclick=()=>{ mi=(mi+1)%MONTHS.length; renderCal(); };



// Tab 切换
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('view-'+t.dataset.v).classList.add('on');
  };
});

document.getElementById('q').addEventListener('input',e=>{ F.q=e.target.value; renderBoard(); });
renderChips('board-filters', catOrder, F.cat);
renderStatusChips();
renderLegend();
renderChips('cal-filters', catOrder, F.cat);
renderMonthChips();
renderBoard();
renderCal();
</script>
</body>
</html>
