同步发布“双轨主理人”机制，由有经验的社区骨干与青年力量协作参与社群运营。伴随着聘书和社群授名，一批主理人正式“上岗”，从兴趣活动的参与者、组织者，进一步成为连接社群成员的重要纽带。\n五大社群专属Logo、社群视觉物料及项目期间的特色活动也在现场集中亮相，让每个社群都有了更加鲜明的“身份标识”。\n仪式之后，现场变身“社群开放日”。五大社群展位同步开放，居民可以体验互动、盖下专属“社群护照章”，也可以扫码加入感兴趣的社群。“里弄潮集社”“吴侬软语社”还现场发布首场体验活动名额，向社区居民发出第一份“组队邀请”。\n从一次体验认识一群人，从共同兴趣形成稳定连接，再从社群参与逐步走向社区参与——接下来，“社群和鸣”还将通过主理人培育、社群共创和公益反哺等方式，让更多居民在老西门找到自己的兴趣伙伴，也找到参与社区共治的新方式。","feedback":"活动素材的提交颗粒度还需持续对齐。","group":"全体社群","line":"天韵项目团队","signPhotos":["assets/0824/thumbs/20260824180341.jpg?v=202608261930","assets/0824/thumbs/20260824180416.jpg?v=202608261930","assets/0824/thumbs/20260824180737.jpg?v=202608261930","assets/0824/thumbs/20260824180743.jpg?v=202608261930","assets/0824/thumbs/20260824180748.jpg?v=202608261930","assets/0824/thumbs/20260824180754.jpg?v=202608261930"],"actPhotos":["assets/0824/thumbs/0c1eaf668ce057d55b65492069bad4c.jpg?v=202608261930","assets/0824/thumbs/4550b3b3e539bc654b242a4e150a82d.jpg?v=202608261930","assets/0824/thumbs/5ef335951adac437e8c2a498cc9d5cd.jpg?v=202608261930","assets/0824/thumbs/a471977b5d5cf507b3b6154e68cd498.jpg?v=202608261930","assets/0824/thumbs/0824_host_appoint.jpg?v=202608261930","assets/0824/thumbs/total.jpg?v=202608261930"],"source":"manual","id":"a_2026-08-24_0"},{"title":"家门口的小确幸-老西门幸福集市（社群招募）","type":"市集","date":"2026-08-21","place":"上海市黄浦区西藏南路686号，南六广场","count":24,"owner":"孙佳鑫","status":"已完成","note":"活动主题：\n“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目——社群开放日（“家门口的小确幸 老西门幸福集市）\n活动小结：\n8月21日下午，“西门荟治·社群和鸣”社群孵化培训工作项目组受邀参加“2026年老西门幸福集市”。\n在西藏南路肇周路路口的南六广场，项目组入驻“社区集市”摊位，为街道居民带来了丰富多彩的社群开放日体验活动。\n活动现场，居民积极参与“沪语学堂大转盘”活动，体验沪语学习。活动现场，居民踊跃咨询社群主题，工作人员也积极介绍和推广社群，为启动仪式预热。现场共招募到24名居民加入社群。\n加入社群的居民也非常期待，能在家门口参与到更多形式丰富的活动，增加凝聚力，为小区治理注入自己更多力量。","feedback":"无","group":"全体社群","line":"天韵项目团队","signPhotos":["assets/0821/thumbs/295815cca274a9c68d831a9d6f89e72.jpg?v=202608261930","assets/0821/thumbs/a1abd8b0100bb886725a4d96e2a4bd7.jpg?v=202608261930"],"actPhotos":["assets/0821/thumbs/f29604792b5e18ce19da501e264e729.jpg?v=202608261930"],"source":"manual","id":"a_20 umbs/f29604792b5e18ce19da501e264e729.jpg?v=202608261930"],"source":"manual"},{"id":"a_2026-08-24_0","title":"项目启动仪式&社群开放日","type":"仪式","date":"2026-08-24","place":"上海市黄浦区老西门肇周路55号3楼，悦西门·零距离家园","count":88,"owner":"龚学群","status":"已完成","note":"活动主题：\n“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目——社区启动仪式&社群开放日\n活动小结：\n8月24日下午，“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目正式启动。社群主理人和社区居民代表齐聚老西门悦西门零距离家园，在展示、体验与互动中共同开启老西门社群培育的新探索。\n今年，老西门街道启动“西门荟治·社群和鸣”项目，以“盘活存量、培育增量、激活能量”为思路，将居民兴趣、社区资源与公共参与进一步连接起来。\n启动仪式上，居民代表和主理人共同拼接“社群地图”，五大社群版图逐一点亮，标志着项目正式启幕。\n五大社群通过表演、作品展示和现场访谈等方式集中亮相。古韵悠扬舞蹈队通过舞蹈展现健康活力，手工作品传递指尖巧思，《龙门谣》讲述社区故事，沪剧《燕燕做媒》唱响吴侬软语，传统礼仪展示则带大家感受老城厢文化魅力。各具特色的展示，也让现场居民更直观地认识五大社群：“杏林守艺堂”聚焦健康生活与文体兴趣；“指尖温度圈”以手作连接公益与邻里关怀；“邻里议事厅”从社区安全、环境治理等身边事出发，推动居民参与；“吴侬软语社”以沪语和海派文化连接不同人群；“里弄潮集社”则依托老城厢文化资源，探索城市漫步、文化体验等更多玩法。\n现场同步发布“双轨主理人”机制，由有经验的社区骨干与青年力量协作参与社群运营。伴随着聘书和社群授名，一批主理人正式“上岗”，从兴趣活动的参与者、组织者，进一步成为连接社群成员的重要纽带。\n五大社群专属Logo、社群视觉物料及项目期间的特色活动也在现场集中亮相，让每个社群都有了更加鲜明的“身份标识”。\n仪式之后，现场变身“社群开放日”。五大社群展位同步开放，居民可以体验互动、盖下专属“社群护照章”，也可以扫码加入感兴趣的社群。“里弄潮集社”“吴侬软语社”还现场发布首场体验活动名额，向社区居民发出第一份“组队邀请”。\n从一次体验认识一群人，从共同兴趣形成稳定连接，再从社群参与逐步走向社区参与——接下来，“社群和鸣”还将通过主理人培育、社群共创和公益反哺等方式，让更多居民在老西门找到自己的兴趣伙伴，也找到参与社区共治的新方式。","group":"全体社群","line":"天韵项目团队","signPhotos":["assets/0824/thumbs/20260824180341.jpg?v=202608261930","assets/0824/thumbs/20260824180416.jpg?v=202608261930","assets/0824/thumbs/20260824180737.jpg?v=202608261930","assets/0824/thumbs/20260824180743.jpg?v=202608261930","assets/0824/thumbs/20260824180748.jpg?v=202608261930","assets/0824/thumbs/20260824180754.jpg?v=202608261930"],"actPhotos":["assets/0824/thumbs/0c1eaf668ce057d55b65492069bad4c.jpg?v=202608261930","assets/0824/thumbs/4550b3b3e539bc654b242a4e150a82d.jpg?v=202608261930","assets/0824/thumbs/5ef335951adac437e8c2a498cc9d5cd.jpg?v=202608261930","assets/0824/thumbs/a471977b5d5cf507b3b6154e68cd498.jpg?v=202608261930","assets/0824/thumbs/0824_host_appoint.jpg?v=202608261930","assets/0824/thumbs/total.jpg?v=202608261930"],"source":"manual"}]};
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const acts=(PROGRAM.dashActs||[]);
const people=acts.reduce((s,a)=>s+(+a.count||0),0);
document.getElementById('kpi').innerHTML=
  `<div class="box"><div class="num">${acts.length}</div><div class="lbl">已开展活动</div></div>
   <div class="box"><div class="num">${people}</div><div class="lbl">累计参与人次</div></div>
   <div class="box"><div class="num">${PROGRAM.communities?PROGRAM.communities.length:5}</div><div class="lbl">孵化社群数</div></div>`;

function cardHTML(a){
  const photos=(a.signPhotos||[]).concat(a.actPhotos||[]);
  const hasPhotos=photos.length>0;
  return `<div class="lc">
  <div class="lct"><span class="lcb">${esc(a.date)}</span><b>${esc(a.title)}</b></div>
  <div class="lcm"><span><b>社群：</b>${esc(a.group||'')}</span><span><b>形式：</b>${esc(a.type||'')}</span><span><b>负责人：</b>${esc(a.owner||'')}</span><span><b>参与：</b>${a.count||0}人</span></div>
  ${a.note?`<div class="lcn" id="lc_${a.id}">${esc(a.note)}</div><button class="ntg" onclick="toggleNote('lc_${a.id}',this)">展开全文 ▾</button>`:''}
  ${hasPhotos?`<div class="ph-fold">
    <button class="ntg" data-n="${photos.length}" onclick="togglePhotos('ph_${a.id}',this)">📷 查看照片（${photos.length}）▾</button>
    <div class="ph-body" id="ph_${a.id}" style="display:none">
      ${(a.signPhotos&&a.signPhotos.length)?`<div class="ph-title">📋 签到表（${a.signPhotos.length}）</div><div class="ph-grid">${a.signPhotos.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" onerror="this.parentNode.style.display='none'"></a>`).join('')}</div>`:''}
      ${(a.actPhotos&&a.actPhotos.length)?`<div class="ph-title">📷 活动现场（${a.actPhotos.length}）</div><div class="ph-grid">${a.actPhotos.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" onerror="this.parentNode.style.display='none'"></a>`).join('')}</div>`:''}
    </div>
  </div>`:''}
</div>`;
}

document.getElementById('cards').innerHTML = acts.length ? acts.map(cardHTML).join('') : '<div class="empty">暂无活动</div>';

function toggleNote(id,btn){const el=document.getElementById(id);const open=el.classList.toggle('open');btn.textContent=open?'收起 ▴':'展开全文 ▾';}
function togglePhotos(id,btn){const el=document.getElementById(id);const show=el.style.display!=='block';el.style.display=show?'block':'none';const n=btn.dataset.n;btn.textContent=show?`📷 收起照片（${n}）▴`:`📷 查看照片（${n}）▾`;}
</script>
