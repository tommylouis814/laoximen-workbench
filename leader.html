79","name":"项目结项验收","category":"品牌输出","community":"全体社群","phase":"项目结项","planStart":"2026-11-01","due":"2026-11-30","owner":"龚学群、孙佳鑫","coop":"天韵项目团队、街道","status":"未启动","goal":"结项报告+验收通过,11月30日前完成报告","note":"不适用","checkPoint":"","actionPoint":"","nextPlan":"","stage":"待开始","place":"-","contact":"","timeNote":"发生时"}],"acts":[{"title":"项目启动仪式&社群开放日","type":"仪式","date":"2026-08-24","place":"上海市黄浦区老西门肇周路55号3楼，悦西门·零距离家园","count":88,"owner":"龚学群","status":"已完成","note":"活动主题：\n“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目——社区启动仪式&社群开放日\n活动小结：\n8月24日下午，“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目正式启动。社群主理人和社区居民代表齐聚老西门悦西门零距离家园，在展示、体验与互动中共同开启老西门社群培育的新探索。\n今年，老西门街道启动“西门荟治·社群和鸣”项目，以“盘活存量、培育增量、激活能量”为思路，将居民兴趣、社区资源与公共参与进一步连接起来。\n启动仪式上，居民代表和主理人共同拼接“社群地图”，五大社群版图逐一点亮，标志着项目正式启幕。\n五大社群通过表演、作品展示和现场访谈等方式集中亮相。古韵悠扬舞蹈队通过舞蹈展现健康活力，手工作品传递指尖巧思，《龙门谣》讲述社区故事，沪剧《燕燕做媒》唱响吴侬软语，传统礼仪展示则带大家感受老城厢文化魅力。各具特色的展示，也让现场居民更直观地认识五大社群：“杏林守艺堂”聚焦健康生活与文体兴趣；“指尖温度圈”以手作连接公益与邻里关怀；“邻里议事厅”从社区安全、环境治理等身边事出发，推动居民参与；“吴侬软语社”以沪语和海派文化连接不同人群；“里弄潮集社”则依托老城厢文化资源，探索城市漫步、文化体验等更多玩法。\n现场同步发布“双轨主理人”机制，由有经验的社区骨干与青年力量协作参与社群运营。伴随着聘书和社群授名，一批主理人正式“上岗”，从兴趣活动的参与者、组织者，进一步成为连接社群成员的重要纽带。\n五大社群专属Logo、社群视觉物料及项目期间的特色活动也在现场集中亮相，让每个社群都有了更加鲜明的“身份标识”。\n仪式之后，现场变身“社群开放日”。五大社群展位同步开放，居民可以体验互动、盖下专属“社群护照章”，也可以扫码加入感兴趣的社群。“里弄潮集社”“吴侬软语社”还现场发布首场体验活动名额，向社区居民发出第一份“组队邀请”。\n从一次体验认识一群人，从共同兴趣形成稳定连接，再从社群参与逐步走向社区参与——接下来，“社群和鸣”还将通过主理人培育、社群共创和公益反哺等方式，让更多居民在老西门找到自己的兴趣伙伴，也找到参与社区共治的新方式。","feedback":"活动素材的提交颗粒度还需持续对齐。","group":"全体社群","line":"天韵项目团队","signPhotos":["assets/0824/thumbs/20260824180341.jpg?v=202609041703","assets/0824/thumbs/20260824180416.jpg?v=202609041703","assets/0824/thumbs/20260824180737.jpg?v=202609041703","assets/0824/thumbs/20260824180743.jpg?v=202609041703","assets/0824/thumbs/20260824180748.jpg?v=202609041703","assets/0824/thumbs/20260824180754.jpg?v=202609041703"],"actPhotos":["assets/0824/thumbs/0c1eaf668ce057d55b65492069bad4c.jpg?v=202609041703","assets/0824/thumbs/4550b3b3e539bc654b242a4e150a82d.jpg?v=202609041703","assets/0824/thumbs/5ef335951adac437e8c2a498cc9d5cd.jpg?v=202609041703 人共同拼接“社群地图”，五大社群版图逐一点亮，标志着项目正式启幕。\n五大社群通过表演、作品展示和现场访谈等方式集中亮相。古韵悠扬舞蹈队通过舞蹈展现健康活力，手工作品传递指尖巧思，《龙门谣》讲述社区故事，沪剧《燕燕做媒》唱响吴侬软语，传统礼仪展示则带大家感受老城厢文化魅力。各具特色的展示，也让现场居民更直观地认识五大社群：“杏林守艺堂”聚焦健康生活与文体兴趣；“指尖温度圈”以手作连接公益与邻里关怀；“邻里议事厅”从社区安全、环境治理等身边事出发，推动居民参与；“吴侬软语社”以沪语和海派文化连接不同人群；“里弄潮集社”则依托老城厢文化资源，探索城市漫步、文化体验等更多玩法。\n现场同步发布“双轨主理人”机制，由有经验的社区骨干与青年力量协作参与社群运营。伴随着聘书和社群授名，一批主理人正式“上岗”，从兴趣活动的参与者、组织者，进一步成为连接社群成员的重要纽带。\n五大社群专属Logo、社群视觉物料及项目期间的特色活动也在现场集中亮相，让每个社群都有了更加鲜明的“身份标识”。\n仪式之后，现场变身“社群开放日”。五大社群展位同步开放，居民可以体验互动、盖下专属“社群护照章”，也可以扫码加入感兴趣的社群。“里弄潮集社”“吴侬软语社”还现场发布首场体验活动名额，向社区居民发出第一份“组队邀请”。\n从一次体验认识一群人，从共同兴趣形成稳定连接，再从社群参与逐步走向社区参与——接下来，“社群和鸣”还将通过主理人培育、社群共创和公益反哺等方式，让更多居民在老西门找到自己的兴趣伙伴，也找到参与社区共治的新方式。","theme":"“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目——社区启动仪式&社群开放日","summary":"8月24日下午，“西门荟治·社群和鸣”老西门街道社群孵化与社区共治培育项目正式启动。社群主理人和社区居民代表齐聚老西门悦西门零距离家园，在展示、体验与互动中共同开启老西门社群培育的新探索。\n今年，老西门街道启动“西门荟治·社群和鸣”项目，以“盘活存量、培育增量、激活能量”为思路，将居民兴趣、社区资源与公共参与进一步连接起来。\n启动仪式上，居民代表和主理人共同拼接“社群地图”，五大社群版图逐一点亮，标志着项目正式启幕。\n五大社群通过表演、作品展示和现场访谈等方式集中亮相。古韵悠扬舞蹈队通过舞蹈展现健康活力，手工作品传递指尖巧思，《龙门谣》讲述社区故事，沪剧《燕燕做媒》唱响吴侬软语，传统礼仪展示则带大家感受老城厢文化魅力。各具特色的展示，也让现场居民更直观地认识五大社群：“杏林守艺堂”聚焦健康生活与文体兴趣；“指尖温度圈”以手作连接公益与邻里关怀；“邻里议事厅”从社区安全、环境治理等身边事出发，推动居民参与；“吴侬软语社”以沪语和海派文化连接不同人群；“里弄潮集社”则依托老城厢文化资源，探索城市漫步、文化体验等更多玩法。\n现场同步发布“双轨主理人”机制，由有经验的社区骨干与青年力量协作参与社群运营。伴随着聘书和社群授名，一批主理人正式“上岗”，从兴趣活动的参与者、组织者，进一步成为连接社群成员的重要纽带。\n五大社群专属Logo、社群视觉物料及项目期间的特色活动也在现场集中亮相，让每个社群都有了更加鲜明的“身份标识”。\n仪式之后，现场变身“社群开放日”。五大社群展位同步开放，居民可以体验互动、盖下专属“社群护照章”，也可以扫码加入感兴趣的社群。“里弄潮集社”“吴侬软语社”还现场发布首场体验活动名额，向社区居民发出第一份“组队邀请”。\n从一次体验认识一群人，从共同兴趣形成稳定连接，再从社群参与逐步走向社区参与——接下来，“社群和鸣”还将通过主理人培育、社群共创和公益反哺等方式，让更多居民在老西门找到自己的兴趣伙伴，也找到参与社区共治的新方式。","group":"全体社群","line":"天韵项目团队","signPhotos":["assets/0824/thumbs/20260824180341.jpg?v=202609041703","assets/0824/thumbs/20260824180416.jpg?v=202609041703","assets/0824/thumbs/20260824180737.jpg?v=202609041703","assets/0824/thumbs/20260824180743.jpg?v=202609041703","assets/0824/thumbs/20260824180748.jpg?v=202609041703","assets/0824/thumbs/20260824180754.jpg?v=202609041703"],"actPhotos":["assets/0824/thumbs/0c1eaf668ce057d55b6549206 const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const COMM_COLORS={
  '里弄潮集社':{bg:'#FFF3E0',fg:'#E65100'},
  '吴侬软语坊':{bg:'#EDE7F6',fg:'#4527A0'},
  '杏林守艺堂':{bg:'#E8F5E9',fg:'#2E7D32'},
  '指尖温度圈':{bg:'#FCE4EC',fg:'#C2185B'},
  '邻里议事厅':{bg:'#E3F2FD',fg:'#1565C0'},
  '全体社群':{bg:'#ECEFF1',fg:'#546E7A'}
};
function commBadge(t){
  const c=COMM_COLORS[t]||COMM_COLORS['全体社群'];
  return `<span style="display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:${c.bg};color:${c.fg};border:1px solid ${c.fg}22">${esc(t)}</span>`;
}

const acts=(PROGRAM.dashActs||[]);
const people=acts.reduce((s,a)=>s+(+a.count||0),0);
document.getElementById('kpi').innerHTML=
  `<div class="box"><div class="num">${acts.length}</div><div class="lbl">已开展活动</div></div>
   <div class="box"><div class="num">${people}</div><div class="lbl">累计参与人次</div></div>
   <div class="box"><div class="num">${PROGRAM.communities?PROGRAM.communities.length:5}</div><div class="lbl">孵化社群数</div></div>`;

function cardHTML(a){
  const photos=(a.signPhotos||[]).concat(a.actPhotos||[]);
  const hasPhotos=photos.length>0;
  return `<div class="lc">
  <div class="lct"><span class="lcb">${esc(a.date)}</span><b>${esc(a.title)}</b></div>
  <div class="lcm"><span><b>社群：</b>${commBadge(a.group||'')}</span><span><b>形式：</b>${esc(a.type||'')}</span><span><b>负责人：</b>${esc(a.owner||'')}</span><span><b>参与：</b>${a.count||0}人</span></div>
  ${a.theme?`<div class="lcn" id="lc_${a.id}">${esc(a.theme)}</div><button class="ntg" onclick="toggleNote('lc_${a.id}',this)">展开全文 ▾</button>`:''}
  ${a.summary?`<div class="lcn" id="lcsum_${a.id}" style="border-left-color:#993556">📝 活动小结：${esc(a.summary)}</div><button class="ntg" onclick="toggleNote('lcsum_${a.id}',this)">展开 ▾</button>`:''}
  ${hasPhotos?`<div class="ph-fold">
    <button class="ntg" data-n="${photos.length}" onclick="togglePhotos('ph_${a.id}',this)">📷 查看照片（${photos.length}）▾</button>
    <div class="ph-body" id="ph_${a.id}" style="display:none">
      ${(a.signPhotos&&a.signPhotos.length)?`<div class="ph-title">📋 签到表（${a.signPhotos.length}）</div><div class="ph-grid">${a.signPhotos.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" onerror="this.parentNode.style.display='none'"></a>`).join('')}</div>`:''}
      ${(a.actPhotos&&a.actPhotos.length)?`<div class="ph-title">📷 活动现场（${a.actPhotos.length}）</div><div class="ph-grid">${a.actPhotos.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" onerror="this.parentNode.style.display='none'"></a>`).join('')}</div>`:''}
    </div>
  </div>`:''}
</div>`;
}

document.getElementById('cards').innerHTML = acts.length ? acts.map(cardHTML).join('') : '<div class="empty">暂无活动</div>';

// ---- 街道相关待办提醒（只显示关联方含「街道」「居民区书记」的待办，含已完成） ----
(function renderStreetTodo(){
  const td = PROGRAM.todo || {buckets:{overdue:[],d3:[],d7:[],d10:[],far:[],nodue:[],done:[]}};
  const b = td.buckets || {};
  // 收集街道相关（is_street）的待办，按档位归类
  const defs = [
    {key:'overdue',label:'已逾期',color:'#C41E3A'},
    {key:'d3',label:'3天内',color:'#DD6B20'},
    {key:'d7',label:'7天内',color:'#B7791F'},
    {key:'d10',label:'10天内',color:'#007BA3'},
    {key:'far',label:'远期',color:'#8A94A6'},
    {key:'nodue',label:'无截止',color:'#8A94A6'},
    {key:'done',label:'已完成',color:'#38A169'},
  ];
  let items = [];
  defs.forEach(d=>{
    (b[d.key]||[]).forEach(t=>{ if(t.is_street) items.push({...t, _bucket:d}); });
  });
  const box = document.getElementById('street-todo');
  if(!items.length){
    box.innerHTML = '';
    return;
  }
  const doneCnt = items.filter(t=>t.is_done).length;
  const activeCnt = items.length - doneCnt;
  let html = '<div class="lc" style="border-left-color:#C41E3A;margin-top:4px;background:linear-gradient(180deg,#FFF7F7,#FFFFFF)">';
  html += '<div class="lct"><span class="lcb" style="background:#C41E3A;color:#fff">📌 待办提醒</span><b>街道相关待办事项</b><span style="margin-left:auto;background:#C41E3A;color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:12px">进行中 ${activeCnt} ｜ 已完成 ${doneCnt}</span></div>';
  html += '<div style="margin-top:6px">';
  items.forEach(t=>{
    const d = t.days;
    const done = t.is_done;
    const due = t.due ? t.due.slice(5) : '—';
    const daysTxt = done ? '' : (d===null||d===undefined ? '' : (d<0 ? `（已逾期${-d}天）` : (d===0 ? '（今天截止）' : `（剩${d}天）`)));
    const owner = (t.owner||[]).join('、');
    const acts = (t.activities||[]).map(a=>a.title).join('、');
    const summary = t.summary || '';
    const target = t.target || '';
    const status = (t.status||[])[0] || '';
    const statusColor = {待办:'#8A94A6',进行中:'#007BA3',已完成:'#38A169',已逾期:'#C41E3A'}[status] || '#8A94A6';
    html += `<div style="padding:8px 0;border-top:1px dashed #F0C9C9;font-size:13px;color:${done?'#6B7280':'#33425A'}">
      <span style="display:inline-block;background:${t._bucket.color};color:#fff;font-size:11px;padding:1px 8px;border-radius:8px;margin-right:6px">${t._bucket.label}</span>
      ${status?`<span style="display:inline-block;background:${statusColor};color:#fff;font-size:11px;padding:1px 8px;border-radius:8px;margin-right:6px">${status}</span>`:''}
      <b>${esc(t.title)}</b> ${daysTxt}
      ${summary?`<div style="margin-top:3px;color:#4A5568;font-size:12px;background:#FFF0F0;border-left:3px solid #C41E3A;padding:3px 8px;border-radius:4px">📝 ${esc(summary)}</div>`:''}
      ${target?`<div style="margin-top:3px;color:#5A4A3A;font-size:12px;background:#FDF6EC;border-left:3px solid #DD6B20;padding:3px 8px;border-radius:4px">👥 关联对象：${esc(target)}</div>`:''}
      <div style="margin-top:3px;color:#5A6B82;font-size:12px">📅 截止 ${due}${owner?` ｜ 👤 ${esc(owner)}`:''}${acts?` ｜ 🎯 ${esc(acts)}`:''}</div>
    </div>`;
  });
  html += '</div></div>';
  box.innerHTML = html;
})();

function toggleNote(id,btn){const el=document.getElementById(id);const open=el.classList.toggle('open');btn.textContent=open?'收起 ▴':'展开全文 ▾';}
function togglePhotos(id,btn){const el=document.getElementById(id);const show=el.style.display!=='block';el.style.display=show?'block':'none';const n=btn.dataset.n;btn.textContent=show?`📷 收起照片（${n}）▴`:`📷 查看照片（${n}）▾`;}
</script>
